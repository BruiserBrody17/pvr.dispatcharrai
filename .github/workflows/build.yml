name: Build

on:
  push:
    branches: [master]
    # No "v" prefix: matches this project's own tagging convention
    # (0.4.0, 1.0.0-beta.1, ...), confirmed against actual tag pushes --
    # "v*" here previously matched none of them, so the tag trigger below
    # (and the release-asset upload it gates) had never actually fired for
    # a real release.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to upload release assets on a tag push

env:
  KODI_BRANCH: Omega # match whatever Kodi major version you're targeting

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out addon source
        uses: actions/checkout@v4
        with:
          path: addons/pvr.dispatcharrai

      - name: Check out Kodi (for the binary-addons build harness)
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: ${{ env.KODI_BRANCH }}
          path: kodi-source
          fetch-depth: 1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake curl pkg-config

      - name: Register addon with the build harness
        run: |
          mkdir -p addon-defs/pvr.dispatcharrai
          echo "pvr.dispatcharrai file://${{ github.workspace }}/addons/pvr.dispatcharrai" \
            > addon-defs/pvr.dispatcharrai/pvr.dispatcharrai.txt

      - name: Build addon via Kodi binary-addons harness
        run: |
          cd kodi-source
          make -j"$(getconf _NPROCESSORS_ONLN)" -C tools/depends/target/binary-addons \
            ADDONS="pvr.dispatcharrai" \
            ADDONS_DEFINITION_DIR="${{ github.workspace }}/addon-defs" \
            PREFIX="${{ github.workspace }}/install" \
            EXTRA_CMAKE_ARGS="-DPACKAGE_ZIP=ON" \
            PACKAGE=1

      # -DPACKAGE_DIR doesn't actually redirect CPack's output for this
      # harness (confirmed: the run log shows CPack still writing the zip
      # deep inside the addon's own ExternalProject build tree regardless)
      # -- PACKAGE_ZIP=ON alone is enough to make CPack build it, so just
      # find it afterward rather than depending on an unhonored variable.
      - name: Collect built zip
        run: |
          mkdir -p dist
          find kodi-source/tools/depends/target/binary-addons -name 'addon-pvr.dispatcharrai-*.zip' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvr.dispatcharrai-${{ matrix.os }}
          path: dist/*.zip

      # Actions artifacts (above) aren't reachable from a Release page and
      # expire after ~90 days -- a real user installing this addon needs an
      # actual downloadable zip attached to the release itself. Only on a
      # tag push (a real version, not every commit to master/a PR).
      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  # The two companion Dispatcharr plugins (dispatcharr-plugin/*) are plain
  # Python, installed directly on a Dispatcharr instance, not through Kodi
  # -- no compilation, no Kodi source checkout, no platform matrix needed,
  # unlike the addon itself above. Each plugin's own README documents that
  # Dispatcharr identifies a plugin by the folder name inside its zip, not
  # the zip's own filename, so each zip's top-level entry is the plugin's
  # own directory name (timeshift_buffer/, recording_edl/) -- confirmed
  # against a real Dispatcharr instance that a mismatch here 404s every
  # call with "Plugin not found" (see each plugin's own README).
  package-dispatcharr-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Zip each plugin
        run: |
          mkdir -p dist
          cd dispatcharr-plugin
          for plugin in timeshift_buffer recording_edl; do
            zip -r "../dist/${plugin}.zip" "$plugin"
          done
          ls -la ../dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispatcharr-plugins
          path: dist/*.zip

      - name: Attach zips to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out addon source
        uses: actions/checkout@v4
        with:
          path: addons/pvr.dispatcharrai

      - name: Check out Kodi
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: ${{ env.KODI_BRANCH }}
          path: kodi-source
          fetch-depth: 1

      - name: Register addon with the build harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path addon-defs/pvr.dispatcharrai | Out-Null
          "pvr.dispatcharrai file:///${{ github.workspace }}/addons/pvr.dispatcharrai" |
            Out-File -Encoding ascii addon-defs/pvr.dispatcharrai/pvr.dispatcharrai.txt

      # Windows has no system libcurl, unlike Linux/macOS. Kodi's own
      # cmake/addons/depends/windows project fetches prebuilt archives listed
      # as <lib-id> <url> under its prebuilt/ subdirectory and installs them
      # into ADDON_DEPENDS_PATH -- point that at the same depends directory
      # the main addon build will look in by default (<BUILD_DIR>/depends),
      # so a single, unmodified find_package(Kodi)/find_package(CURL) picks
      # both up together. curl here also needs OpenSSL and zlib to link
      # (verified by actually running this build -- CURLConfig.cmake pulls
      # them in transitively).
      #
      # Generator: "Visual Studio 18 2026", not "17 2022" -- confirmed via a
      # live run's diagnostics that windows-latest now ships only VS2026
      # (Enterprise, installed at C:\Program Files\Microsoft Visual
      # Studio\18\Enterprise); no VS2022 instance exists on the runner at
      # all anymore, so CMake's generator lookup failed outright ("could not
      # find any instance of Visual Studio") rather than falling back. If
      # this starts failing again after a future runner image update, rerun
      # the same diagnostic (vswhere -all -format json) before guessing at
      # another generator string.
      - name: Fetch prebuilt curl/OpenSSL/zlib for Windows
        shell: pwsh
        run: |
          $depends = "${{ github.workspace }}/build/build/depends"
          $prebuilt = "kodi-source/cmake/addons/depends/windows/prebuilt"
          "curl http://mirrors.kodi.tv/build-deps/win32/curl-7.67.0-x64-v141-20200105.7z" |
            Out-File -Encoding ascii "$prebuilt/curl.txt"
          "openssl http://mirrors.kodi.tv/build-deps/win32/openssl-1.1.1q-x64-v142-20221017.7z" |
            Out-File -Encoding ascii "$prebuilt/openssl.txt"
          "zlib http://mirrors.kodi.tv/build-deps/win32/zlib-1.2.11-x64-v141-20200105.7z" |
            Out-File -Encoding ascii "$prebuilt/zlib.txt"
          cmake -S kodi-source/cmake/addons/depends/windows -B deps-build -G "Visual Studio 18 2026" -A x64 "-DADDON_DEPENDS_PATH=$depends"
          cmake --build deps-build --config Release
          # Remove the registrations before the main build: the generic addon-depends
          # scan below (add_addon_depends) also globs this same prebuilt/ directory,
          # and having both declare a target of the same name is a hard configure error.
          Remove-Item "$prebuilt/curl.txt", "$prebuilt/openssl.txt", "$prebuilt/zlib.txt"

      - name: Build addon (CMake, MSVC)
        shell: pwsh
        run: |
          cmake -S kodi-source/cmake/addons -B build -G "Visual Studio 18 2026" -A x64 `
            "-DADDONS_TO_BUILD=pvr.dispatcharrai" `
            "-DADDONS_DEFINITION_DIR=${{ github.workspace }}/addon-defs" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install" `
            "-DPACKAGE_ZIP=ON" `
            "-DPACKAGE_DIR=${{ github.workspace }}/dist" `
            "-DBUILD_DIR=${{ github.workspace }}/build/build"
          cmake --build build --config Release --target package-pvr.dispatcharrai

      # -DPACKAGE_DIR doesn't take effect here either (same unhonored-variable
      # issue as the Unix harness above) -- on Windows CPack instead drops the
      # zip in the OS temp dir (confirmed via a real run's CPack log: it wrote
      # to C:\Users\RUNNER~1\AppData\Local\Temp\addon-pvr.dispatcharrai-*.zip,
      # i.e. $env:TEMP), which the "Upload build artifact" step silently found
      # nothing at ("No files were found with the provided path: dist/*.zip")
      # since dist/ was never created. Copy it out of $env:TEMP explicitly.
      - name: Collect built zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Get-ChildItem -Path $env:TEMP -Filter 'addon-pvr.dispatcharrai-*.zip' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { throw "Could not find built zip under $env:TEMP" }
          Copy-Item $zip.FullName dist/
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvr.dispatcharrai-windows
          path: dist/*.zip

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
